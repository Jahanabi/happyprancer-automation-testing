name: Post-Merge Playwright Test Automation

on:
  pull_request:
    types: [closed]
    branches:
      - test-workflow
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: post-merge-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post-merge-test-execution:
    name: Generate Scripts & Execute Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - name: Checkout Merged Code
        uses: actions/checkout@v4
        with:
          ref: test-workflow
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Compile Automation Scripts
        run: npx tsc --project tsconfig.automation.json

      - name: Retrieve Exact PR Test Cases (or Fallback Generate)
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gemini-1.5-flash' }}
          TARGET_BRANCH: test-workflow
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"

          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            PR_NUM=$(git log -1 --pretty=%B | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          fi

          echo "=================================================="
          echo "Processing post-merge automation for PR: #${PR_NUM:-unknown}"
          echo "Head SHA: ${HEAD_SHA:-unknown}"
          echo "Head Branch: ${HEAD_BRANCH:-unknown}"
          echo "=================================================="

          mkdir -p automation/test-cases/generated
          RETRIEVED=false

          # 1. Attempt to retrieve the exact PR's generated test cases artifact
          if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
            echo "Searching for workflow run belonging specifically to PR #$PR_NUM..."

            PR_RUN_ID=""
            if [ -n "$HEAD_SHA" ] && [ "$HEAD_SHA" != "null" ]; then
              PR_RUN_ID=$(gh run list --workflow="ai-test-generation-pr.yml" --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" 2>/dev/null | head -n 1 || echo "")
            fi

            if [ -z "$PR_RUN_ID" ] && [ -n "$HEAD_BRANCH" ] && [ "$HEAD_BRANCH" != "null" ]; then
              PR_RUN_ID=$(gh run list --workflow="ai-test-generation-pr.yml" --branch "$HEAD_BRANCH" --limit 5 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
            fi

            if [ -z "$PR_RUN_ID" ]; then
              PR_RUN_ID=$(gh run list --workflow="ai-test-generation-pr.yml" --limit 10 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
            fi

            if [ -n "$PR_RUN_ID" ] && [ "$PR_RUN_ID" != "null" ]; then
              echo "Found matching PR workflow run ID: $PR_RUN_ID for PR #$PR_NUM."
              echo "Downloading exact PR artifact 'pr-test-cases-$PR_NUM'..."
              if gh run download "$PR_RUN_ID" --name "pr-test-cases-$PR_NUM" --dir automation/test-cases/generated 2>/dev/null; then
                if [ -f "automation/test-cases/generated/latest-test-cases.json" ] && [ -s "automation/test-cases/generated/latest-test-cases.json" ]; then
                  echo "Successfully retrieved latest-test-cases.json from exact PR artifact 'pr-test-cases-$PR_NUM'."
                  RETRIEVED=true
                fi
              fi

              if [ "$RETRIEVED" = "false" ]; then
                echo "Checking for 'pr-generated-test-cases' on run $PR_RUN_ID..."
                if gh run download "$PR_RUN_ID" --name "pr-generated-test-cases" --dir automation/test-cases/generated 2>/dev/null; then
                  if [ -f "automation/test-cases/generated/latest-test-cases.json" ] && [ -s "automation/test-cases/generated/latest-test-cases.json" ]; then
                    echo "Successfully retrieved latest-test-cases.json from run $PR_RUN_ID."
                    RETRIEVED=true
                  fi
                fi
              fi
            else
              echo "No matching PR workflow run found for PR #$PR_NUM."
            fi
          fi

          # 2. Fallback: generate test cases directly from merge commit
          if [ "$RETRIEVED" = "false" ]; then
            echo "--------------------------------------------------"
            echo "[FALLBACK ACTIVATED] Could not retrieve artifact from PR #${PR_NUM:-unknown}."
            echo "Reason: Artifact 'pr-test-cases-${PR_NUM}' was not found or PR run unavailable."
            echo "Executing existing fallback test generation logic from merge commit (HEAD~1)..."
            echo "--------------------------------------------------"
            TARGET_BRANCH=HEAD~1 node automation/dist/automation/scripts/generate-test-cases.js
            if [ -f "automation/test-cases/generated/latest-test-cases.json" ] && [ -s "automation/test-cases/generated/latest-test-cases.json" ]; then
              echo "[FALLBACK SUCCESS] Successfully generated test cases from merge commit diff."
            else
              echo "[ERROR] Fallback test generation did not produce latest-test-cases.json."
              exit 1
            fi
          fi

      - name: Generate Playwright TypeScript Tests from Exact PR Test Cases
        run: |
          node automation/dist/automation/scripts/generate-playwright.js

      - name: Validate Generated Playwright Scripts & Test Discovery
        env:
          BASE_URL: https://beta.happyprancer.com
          SIGNUP_URL: https://beta.happyprancer.com/signup
        run: |
          node automation/dist/automation/scripts/validate-generated-tests.js

      - name: Run Playwright Tests on HappyPrancer Beta Environment
        id: run_tests
        continue-on-error: true
        env:
          CI: 'true'
          BASE_URL: https://beta.happyprancer.com
          SIGNUP_URL: https://beta.happyprancer.com/signup
          AUTH_TEST_DASHBOARD_URL: https://beta.happyprancer.com/dashboard
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          SIGNUP_NAME: ${{ secrets.SIGNUP_NAME || 'Test User' }}
          SIGNUP_EMAIL: ${{ secrets.SIGNUP_EMAIL || 'testuser@example.com' }}
          SIGNUP_PHONE: ${{ secrets.SIGNUP_PHONE || '9876543210' }}
          SIGNUP_PASSWORD: ${{ secrets.SIGNUP_PASSWORD || 'Test@1234' }}
          SIGNUP_CONFIRM_PASSWORD: ${{ secrets.SIGNUP_CONFIRM_PASSWORD || 'Test@1234' }}
          SIGNUP_REFERRAL_CODE: ${{ secrets.SIGNUP_REFERRAL_CODE || 'HPWELCOME' }}
        run: npx playwright test --project=chromium

      - name: Generate Playwright HTML & Post-Merge Excel Execution Reports
        if: always()
        env:
          BASE_URL: https://beta.happyprancer.com
          TARGET_BRANCH: test-workflow
        run: |
          node automation/dist/automation/scripts/export-excel-report.js --execution

      - name: Display Test Execution Summary
        if: always()
        run: |
          if [ -f "reports/execution-summary.md" ]; then
            cat reports/execution-summary.md
          else
            echo "Execution summary report not found."
          fi

      - name: Stage Artifacts (playwright-artifacts)
        if: always()
        run: |
          mkdir -p playwright-artifacts/reports
          mkdir -p playwright-artifacts/generated-scripts
          mkdir -p playwright-artifacts/supporting-files

          # Copy Excel and HTML reports
          cp reports/excel/*.xlsx playwright-artifacts/reports/ 2>/dev/null || true
          cp -r playwright-report/ playwright-artifacts/reports/html-report 2>/dev/null || true
          cp reports/playwright-results.json playwright-artifacts/reports/ 2>/dev/null || true

          # Copy generated test scripts
          cp automation/tests/generated/*.spec.ts playwright-artifacts/generated-scripts/ 2>/dev/null || true
          cp automation/tests/e2e/*.spec.ts playwright-artifacts/generated-scripts/ 2>/dev/null || true

          # Copy supporting POMs and fixtures
          cp -r automation/page-objects/ playwright-artifacts/supporting-files/page-objects 2>/dev/null || true
          cp -r automation/pages/ playwright-artifacts/supporting-files/pages 2>/dev/null || true
          cp -r automation/fixtures/ playwright-artifacts/supporting-files/fixtures 2>/dev/null || true
          cp playwright.config.ts playwright-artifacts/supporting-files/ 2>/dev/null || true

      - name: Upload Downloadable Playwright Test Artifacts Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: playwright-artifacts/
          retention-days: 30

      - name: Upload Post-Merge Excel Execution Report Directly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-report
          path: reports/excel/playwright-execution-report.xlsx
          retention-days: 30

      - name: Upload Playwright HTML Report & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happyprancer-playwright-html-and-traces
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
          retention-days: 30

      - name: Verify Overall Test Results
        if: steps.run_tests.outcome != 'success'
        run: |
          echo "❌ One or more Playwright tests failed against https://beta.happyprancer.com"
          echo "Review the uploaded Excel report and Playwright HTML report for failure diagnostics."
          exit 1
