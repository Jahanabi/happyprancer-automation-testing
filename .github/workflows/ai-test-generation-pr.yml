name: AI Test Generation (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - test-workflow

permissions:
  contents: read

concurrency:
  group: ai-test-gen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-store-test-cases:
    name: Generate & Store Test Cases
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Target Branch (test-workflow)
        run: |
          git fetch origin test-workflow:test-workflow || git fetch origin test-workflow || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Automation Scripts
        run: npx tsc --project tsconfig.automation.json

      - name: Analyze Git Diff & Generate Structured Test Cases via Gemini
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gemini-1.5-flash' }}
          TARGET_BRANCH: test-workflow
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node automation/dist/automation/scripts/generate-test-cases.js

      - name: Validate Generated Test Cases
        env:
          BASE_URL: https://beta.happyprancer.com
          LOGIN_URL: https://beta.happyprancer.com/login
          SIGNUP_URL: https://beta.happyprancer.com/signup
        run: |
          node automation/dist/automation/scripts/validate-generated-tests.js

      - name: Generate Pre-Merge Test Cases Excel Report (PR_Test_Cases.xlsx)
        env:
          TARGET_BRANCH: test-workflow
        run: |
          node automation/dist/automation/scripts/export-excel-report.js --pr

      - name: Display PR Test Case Summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "automation/test-cases/generated/latest-test-cases.json";
            if (fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              let md = "### 📋 AI Test Cases Generated for PR #" + (data.metadata?.prNumber || "${{ github.event.pull_request.number }}") + "\n\n";
              md += "- **Target Branch**: `" + (data.metadata?.targetBranch || "test-workflow") + "`\n";
              md += "- **AI Provider**: `" + (data.metadata?.aiProvider || "offline") + "`\n";
              md += "- **Total Test Cases**: " + (data.testCases?.length || 0) + "\n";
              md += "- **Pre-Merge Excel Report**: `PR_Test_Cases.xlsx`\n";
              md += "- **Affected Modules**: " + ((data.metadata?.affectedModules || []).join(", ") || "None") + "\n\n";
              md += "| Test Case ID | Feature | Objective | Expected Result |\n";
              md += "| :--- | :--- | :--- | :--- |\n";
              for (const tc of (data.testCases || [])) {
                md += `| ${tc.id} | ${tc.feature || tc.module} | ${tc.scenario.replace(/\|/g, "\\|")} | ${tc.expectedResult.replace(/\|/g, "\\|")} |\n`;
              }
              const summaryFile = process.env.GITHUB_STEP_SUMMARY;
              if (summaryFile) fs.appendFileSync(summaryFile, "\n" + md + "\n");
              console.log(md);
            }
          '

      - name: Upload PR Test Cases Package (JSON & Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-cases-${{ github.event.pull_request.number }}
          path: automation/test-cases/generated/
          retention-days: 14

      - name: Upload Pre-Merge Excel Report Directly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-excel-report-${{ github.event.pull_request.number }}
          path: reports/excel/PR_Test_Cases.xlsx
          retention-days: 14

      - name: Upload PR Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-reports-${{ github.event.pull_request.number }}
          path: reports/
          retention-days: 14
